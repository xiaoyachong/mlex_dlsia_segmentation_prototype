[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["mlex_dlsia"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.isort]
profile = "black"

[project]
name = "mlex_dlsia"
version = "0.2.0"
description = "DLSIA models for segmentation in MLExchange"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11, <=3.12"

dependencies = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "lightly-train==0.13.2",
  "pytorch-lightning==2.6.0",
  "numpy==2.2.6",
  "Pillow",
  "mlflow==2.22.0",
  "tiled[client]==0.2.0",
  "entrypoints",
  "stamina",
  "dask",
  "qlty==0.2.0",
  "dvclive==3.44.0",
  "dlsia==0.3.4",
  "pydantic>=1.10.15",
  "pyyaml",
  "python-dotenv",
  "mlex_utils[all] @ git+https://github.com/mlexchange/mlex_utils.git",
]

[project.optional-dependencies]
dev = [
    "black==24.2.0",
    "flake8==7.0.0",
    "isort==5.13.2",
    "pre-commit==3.6.2",
    "tiled[all]==0.2.0",
    "pytest==8.1.1",
    "pytest-asyncio",
    "fastapi==0.121.3"
]
